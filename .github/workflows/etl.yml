name: Vivat ETL

on:
  schedule:
    - cron: '0 6 * * *'  # runs every day at 6:00 AM UTC
  workflow_dispatch:     # manual trigger

jobs:
  run-etl:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
    - name: 📥 Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 📦 Install dependencies
      run: pip install -r requirements.txt

    - name: 🔗 Run parser (collect links)
      run: python etl/parser.py

    - name: 📚 Run parse_books (extract metadata)
      run: python etl/parse_books.py

    - name: 🚀 Run upload_to_supabase (sync to cloud)
      run: python etl/upload_to_supabase.py

    - name: 📝 Commit updated DB
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add db/books_links.sqlite3
        git commit -m "Update DB after ETL run"
        git push
