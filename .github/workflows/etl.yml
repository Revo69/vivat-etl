name: Vivat ETL

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run parser (collect links)
        run: python etl/parser.py

      - name: Run parse_books (extract metadata)
        run: python etl/parse_books.py

      - name: Run upload_to_supabase
        run: python etl/upload_to_supabase.py

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: vitat-etl-logs-${{ github.run_id }}
          path: logs/
          
