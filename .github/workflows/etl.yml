name: Vivat ETL

on:
  schedule:
    - cron: '0 6 * * *'  # runs every day at 6:00 AM UTC
  workflow_dispatch:     # manual trigger

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Check file hash
      run: |
        sha256sum db/books_links.sqlite3

    - name: Run parser
      run: python etl/parser.py
      
    - name: Check file hash
      run: |
        sha256sum db/books_links.sqlite3
    
    - name: Debug Git status and diff
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
    
        echo "🔍 Git status:"
        git status
    
        echo "🔍 Git diff:"
        git diff db/books_links.sqlite3 || echo "No diff output"
    
        if git diff --quiet db/books_links.sqlite3; then
          echo "✅ No changes to commit."
        else
          echo "📦 Changes detected, committing..."
          git add db/books_links.sqlite3
          git commit -m "Update raw_links DB"
          git push
        fi

        
    - name: Check file hash
      run: |
        sha256sum db/books_links.sqlite3
